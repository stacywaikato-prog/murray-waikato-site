<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!-- Netlify Forms registers this form at deploy time. The real form lives on /contact/ and posts here. -->
<form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="enquiry">
  <input name="bot-field">
  <input name="name"><input name="email" type="email"><input name="phone">
  <select name="kind"><option>x</option></select>
  <textarea name="message"></textarea>
</form>
</body></html>
